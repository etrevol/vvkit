version: 1
name: diffusion_1d_temporal
solver:
  type: command
  command: ["python", "../../mock_solver.py", "{input_file}"]
  template: templates/solver.in.j2
  reader:
    type: npz
    file: solution.npz
    coords: {x: x}
    fields: {u: u}
mms:
  operator: "Derivative(u(x, t), t) - alpha*Derivative(u(x, t), (x, 2))"
  solution: "exp(-t)*sin(pi*x)"
  symbols: {alpha: 1.0}
  domain: {x: [0.0, 1.0], t: [0.0, 1.0]}
study:
  type: temporal
  user_params:
    equation: diffusion_1d_temporal
  refinement:
    parameter: n_steps
    values: [10, 20, 40, 80]
  reference: point_value
  expected_order: 1.0
  order_tolerance: 0.2
report:
  formats: [html, json]
  output_dir: reports/
