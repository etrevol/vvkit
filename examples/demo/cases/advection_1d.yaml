version: 1
name: advection_1d
solver:
  type: command
  command: ["python", "../../mock_solver.py", "{input_file}"]
  template: templates/solver.in.j2
  reader:
    type: npz
    file: solution.npz
    coords: {x: x}
    fields: {u: u}
mms:
  operator: "Derivative(u(x, t), t) + c*Derivative(u(x, t), x)"
  solution: "sin(2*pi*x)"
  symbols: {c: 1.0}
  domain: {x: [0.0, 1.0], t: [0.0, 0.1]}
study:
  type: spatial
  user_params:
    equation: advection_1d
  refinement:
    parameter: n_cells
    values: [32, 64, 128, 256]
  reference: cell_average
  expected_order: 2.0
  order_tolerance: 0.2
report:
  formats: [html, json]
  output_dir: reports/
