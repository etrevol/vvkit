version: 1
name: spherical_1d
solver:
  type: command
  command: ["python", "../../mock_solver.py", "{input_file}"]
  template: templates/solver.in.j2
  reader:
    type: npz
    file: solution.npz
    coords: {r: r}
    fields: {u: u}
mms:
  # Laplacian in spherical coords: 1/r^2 * d/dr(r^2 * du/dr)
  operator: "(1/r**2)*Derivative(r**2 * Derivative(u(r), r), r)"
  solution: "r**3 - r**2"
  symbols: {}
  domain: {r: [0.0, 1.0]}
study:
  type: spatial
  user_params:
    equation: spherical_1d
  refinement:
    parameter: n_cells
    values: [16, 32, 64, 128]
  reference: cell_average
  expected_order: 2.0
  order_tolerance: 0.2
report:
  formats: [html, json]
  output_dir: reports/
