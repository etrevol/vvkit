version: 1
name: athena_sod_demo

solver:
  type: athena++
  template: athinput.sod.template
  plugin_args:
    executable: "/home/etrevol/athena-collab/bin/athena"
    use_wsl: true
    wsl_distro: Ubuntu

mms:
  operator: "None"
  solution: "Piecewise((1.0, x <= -0.2958039891549808), ( (2/2.4 - 0.4/(2.4*1.1832159566199232) * (x/0.25))**(2/0.4), x <= -0.017568203140295863 ), (0.42631942817849516, x <= 0.23186315501223745), (0.265573711705307, x <= 0.4380389330075445), (0.125, True))"
  symbols: {}
  domain: {x: [-0.5, 0.5]}

study:
  type: spatial
  refinement:
    parameter: nx1
    values: [64, 128, 256, 512, 1024]
  reference: cell_average
  expected_order: 1.0
  order_tolerance: 0.3
  norms: [L1]
  exclude_boundary_cells: 2
  user_params: {}

report:
  formats: [html, json]
  output_dir: reports/
